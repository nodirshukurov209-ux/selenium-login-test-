
name: Selenium UI Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository kodini yuklash
        uses: actions/checkout@v7

      - name: Python sozlash
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Chrome brauzerini o'rnatish
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Selenium testini bajarish
        run: pytest -v test_login.py
