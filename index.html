
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Login Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 400px;
            max-width: 92%;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #23395d;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 7px;
            text-align: center;
            color: #2563eb;
            font-size: 13px;
        }

        .error {
            color: red;
            margin-top: 15px;
            text-align: center;
        }

        .success {
            color: #15803d;
            text-align: center;
            margin-bottom: 20px;
        }

        #dashboard {
            display: none;
        }

        .welcome {
            text-align: center;
            padding: 20px;
            background: #dcfce7;
            border-radius: 10px;
            color: #166534;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGIN FORMASI -->
        <div id="loginSection">

            <h1>Login tizimi</h1>
            <p class="subtitle">Shaxsiy kabinetga kirish</p>

            <form id="loginForm">

                <label for="username">Foydalanuvchi nomi</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Login kiriting"
                    required
                >

                <label for="password">Parol</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Parol kiriting"
                    required
                >

                <button type="submit" id="loginBtn">
                    Tizimga kirish
                </button>

                <p id="errorMessage" class="error"></p>

            </form>

            <div class="info">
                Test uchun login: student<br>
                Test uchun parol: 12345
            </div>

        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">

            <h1>Dashboard</h1>

            <h3 id="successMessage" class="success">
                Login muvaffaqiyatli amalga oshirildi!
            </h3>

            <div class="welcome">
                <h2>Xush kelibsiz!</h2>
                <p>Siz tizimga muvaffaqiyatli kirdingiz.</p>
                <p id="userInfo"></p>
            </div>

            <button id="logoutBtn">
                Chiqish
            </button>

        </div>

    </div>

    <script>

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("errorMessage");

            if (username === "student" && password === "12345") {

                document.getElementById("loginSection").style.display = "none";

                document.getElementById("dashboard").style.display = "block";

                document.getElementById("userInfo").textContent =
                    "Foydalanuvchi: " + username;

                errorMessage.textContent = "";

                window.location.hash = "dashboard";

            } else {

                errorMessage.textContent =
                    "Login yoki parol noto'g'ri!";

            }

        });

        document.getElementById("logoutBtn").addEventListener("click", function() {

            document.getElementById("dashboard").style.display = "none";

            document.getElementById("loginSection").style.display = "block";

            document.getElementById("username").value = "";

            document.getElementById("password").value = "";

            window.location.hash = "";

        });

    </script>

</body>
</html>
